[package]
name = "pdf2md"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
image = "0.25"
pdf-extract = "0.12.0"
hayro = { version = "0.7.1", features = ["embed-fonts"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.12"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "io-util", "macros"] }

[target.'cfg(unix)'.dependencies]
openssh = "0.11.6"
openssh-sftp-client = { version = "0.15.10", features = ["openssh"] }
