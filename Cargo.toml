[package]
name = "pdf2md"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
image = "0.25"
pdf-extract = "0.7"
hayro = { version = "0.7.1", features = ["embed-fonts"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
